name: Despliegue Seguro a GitHub Pages con Secrets

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Inyectar Secretos de GitHub en env.js
        run: |
          url="${{ secrets.SUPABASE_URL }}"
          key="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$url" ] || [ "$url" = "SUPABASE_ANON_KEY" ] || [ "$url" = "SUPABASE_URL" ]; then
            url="https://iuavuxtstzpbwvmbrely.supabase.co"
          fi
          if [ -z "$key" ] || [ "$key" = "SUPABASE_ANON_KEY" ]; then
            key="sb_publishable_YI0EmePfKteihRVmCvvhaw_bonybHbx"
          fi
          # Limpiar posibles saltos de línea
          url=$(echo "$url" | tr -d '\r\n ' )
          key=$(echo "$key" | tr -d '\r\n ' )
          cat << EOF > env.js
          window.__ENV__ = {
            SUPABASE_URL: '$url',
            SUPABASE_ANON_KEY: '$key',
            ENVIRONMENT: 'production',
            SECURITY_HASH_ALGO: 'SHA-256',
            APP_VERSION: '2.4.0'
          };
          EOF

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefactos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
